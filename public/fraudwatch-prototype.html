function scoreColor(score) {
  if (score >= 70) return "#ef4444";
  if (score >= 40) return "#f59e0b";
  return "#22c55e";
}

// ─── Left Panel ──────────────────────────────────────────────────────────────

function LeftPanel({ carriers: list, selected, onSelect, filter, setFilter, search, setSearch }) {
  const tabs = [
    { id: "all", label: "All", icon: null },
    { id: "trusted", label: "Trusted", icon: ShieldCheck },
    { id: "new", label: "New", badge: true },
    { id: "unauthorized", label: "Unauthorized", icon: ShieldBan },
  ];

  return (
    <aside className="w-[340px] shrink-0 border-r border-gray-200 flex flex-col bg-white">
      <div className="px-4 pt-5 pb-3 border-b border-gray-200">
        <h1 className="text-lg font-bold text-gray-900 mb-4">Carrier Risk Dashboard</h1>
        <div className="flex gap-0.5 mb-4">
          {tabs.map((t) => (
            <button key={t.id} onClick={() => setFilter(t.id)}
              className={`flex items-center gap-1.5 px-3 py-2 text-[13px] font-medium border-b-2 transition-colors ${
                filter === t.id
                  ? "border-blue-600 text-blue-700"
                  : "border-transparent text-gray-500 hover:text-gray-700"
              }`}>
              {t.icon && <t.icon size={14} />}
              {t.badge && (
                <span className="px-1.5 py-0.5 bg-teal-500 text-white text-[9px] font-bold rounded-sm">NEW</span>
              )}
              {t.label}
            </button>
          ))}
        </div>
        <div className="flex gap-2">
          <div className="flex-1 flex items-center gap-2 px-3 py-2 border border-gray-300 rounded-lg bg-white">
            <SearchIcon size={16} className="text-gray-400 shrink-0" />
            <input value={search} onChange={(e) => setSearch(e.target.value)}
              placeholder="Search"
              className="flex-1 text-[13px] outline-none bg-transparent placeholder:text-gray-400" />
          </div>
          <button className="px-3 py-2 border border-gray-300 rounded-lg text-gray-500 hover:text-gray-700 hover:bg-gray-50 transition-colors">
            <SlidersH size={16} />
          </button>
        </div>
      </div>
      <div className="flex-1 overflow-y-auto">
        {list.map((c) => {
          const isSelected = selected?.id === c.id;
          const isTrusted = c.subtext === "No threats identified";
          return (
            <button key={c.id} onClick={() => onSelect(c)}
              className={`w-full text-left px-4 py-3.5 border-b border-gray-100 transition-colors ${
                isSelected ? "bg-[#eff6ff] border-l-[3px] border-l-blue-500" : "hover:bg-gray-50 border-l-[3px] border-l-transparent"
              }`}>
              <div className="flex items-center justify-between">
                <div className="flex-1 min-w-0">
                  <div className="text-[14px] font-semibold text-gray-900 truncate">{c.name}</div>
                  <div className="flex items-center gap-1.5 mt-1">
                    {isTrusted ? (
                      <>
                        <CheckCircle size={13} className="text-green-500 shrink-0" />
                        <span className="text-[12px] text-green-600">{c.subtext}</span>
                      </>
                    ) : (
                      <>
                        <CircleAlertIcon size={13} className="text-amber-500 shrink-0" />
                        <span className="text-[12px] text-gray-500">{c.subtext}</span>
                        {c.extras && <span className="text-[12px] text-gray-400 ml-1">{c.extras}</span>}
                      </>
                    )}
                  </div>
                </div>
                <div className="w-9 h-9 rounded-full flex items-center justify-center text-white text-[12px] font-bold shrink-0 ml-3"
                  style={{ backgroundColor: scoreColor(c.score) }}>
                  {c.score}
                </div>
              </div>
            </button>
          );
        })}
      </div>
    </aside>
  );
}

// ─── Check Card ──────────────────────────────────────────────────────────────

function CheckCard({ check }) {
  const IconComp = check.icon || ShieldIcon;
  return (
    <div className={`relative rounded-lg border p-4 ${check.threat ? "border-red-400 border-2" : "border-gray-200"}`}>
      <div className={`absolute top-0 right-0 px-2.5 py-1 rounded-bl-lg rounded-tr-lg text-[11px] font-semibold flex items-center gap-1 ${
        check.threat
          ? "bg-red-50 text-red-600 border-b border-l border-red-300"
          : "bg-green-50 text-green-600 border-b border-l border-green-200"
      }`}>
        {check.threat ? (
          <span>+{check.count} threat</span>
        ) : (
          <><CheckCircle size={11} /> No threats</>
        )}
      </div>
      <div className="mt-2">
        <IconComp size={22} className={`${check.threat ? "text-red-500" : "text-gray-400"} mb-3`} />
        <div className={`text-[14px] font-semibold mb-1 ${check.threat ? "text-red-700" : "text-gray-900"}`}>{check.name}</div>
        <div className="flex items-center gap-1.5">
          <span className="text-[12px] text-gray-500">{check.detail}</span>
          {check.threat && <InfoIcon size={14} className="text-gray-400 shrink-0 cursor-pointer" />}
        </div>
      </div>
    </div>
  );
}

// ─── Subsection Row ──────────────────────────────────────────────────────────

function SubsectionRow({ icon: Icon, title, description, threatCount, scoreImpact, expanded, onToggle, children }) {
  return (
    <div className="border border-gray-200 rounded-lg overflow-hidden">
      <button onClick={onToggle} className="w-full flex items-center justify-between px-4 py-3.5 hover:bg-gray-50 transition-colors">
        <div className="flex items-center gap-3">
          <Icon size={18} className="text-gray-500" />
          <div className="text-left">
            <span className="text-[14px] font-semibold text-gray-900">{title}</span>
            <span className="text-[12px] text-gray-500 ml-2">{description}</span>
          </div>
        </div>
        <div className="flex items-center gap-3">
          {threatCount > 0 ? (
            <span className="flex items-center gap-1.5 px-3 py-1 rounded-full bg-red-50 border border-red-200 text-[12px] font-semibold text-red-600">
              <AlertTriIcon size={13} />
              {threatCount} threat{threatCount !== 1 ? "s" : ""} identified
              <span className="text-red-500 font-bold ml-1">+{scoreImpact}</span>
            </span>
          ) : (
            <span className="flex items-center gap-1.5 px-3 py-1 rounded-full bg-green-50 border border-green-200 text-[12px] font-semibold text-green-600">
              <CheckCircle size={13} />
              No threats
            </span>
          )}
          {expanded ? <ChevronUp size={18} className="text-gray-400" /> : <ChevronDown size={18} className="text-gray-400" />}
        </div>
      </button>
      {expanded && children && (
        <div className="border-t border-gray-200 px-4 py-4 bg-white">
          {children}
        </div>
      )}
    </div>
  );
}

// ─── Right Panel ─────────────────────────────────────────────────────────────

function RightPanel({ carrier }) {
  const [sections, setSections] = useState({});

  const key = (cid, section) => `${cid}-${section}`;

  const isExpanded = (section) => {
    const k = key(carrier.id, section);
    if (sections[k] !== undefined) return sections[k];
    if (section === "badActor") return carrier.security.badActor.expanded;
    return false;
  };

  const toggle = (section) => {
    const k = key(carrier.id, section);
    setSections((prev) => ({ ...prev, [k]: !isExpanded(section) }));
  };

  const ba = carrier.security.badActor;
  const oh = carrier.security.operationalHistory;
  const hasChecks = ba.checks && ba.checks.length > 0;

  return (
    <main className="flex-1 min-w-0 bg-white overflow-y-auto">
      {/* Header */}
      <div className="flex items-center justify-between px-6 py-4 border-b border-gray-200">
        <div className="flex items-center gap-3">
          <div className="w-10 h-10 rounded-full flex items-center justify-center text-white text-[14px] font-bold"
            style={{ backgroundColor: scoreColor(carrier.score) }}>
            {carrier.score}
          </div>
          <h2 className="text-xl font-bold text-gray-900">{carrier.name}</h2>
        </div>
        <div className="flex items-center gap-2">
          <button className="flex items-center gap-1.5 px-4 py-2 bg-[#1e3a5f] text-white text-[13px] font-medium rounded-lg hover:bg-[#16304f] transition-colors">
            <span className="px-1.5 py-0.5 bg-teal-400 text-[8px] font-bold text-white rounded-sm leading-none">NEW</span>
            New
            <ChevronDown size={14} className="opacity-60" />
          </button>
          <button className="flex items-center gap-2 px-4 py-2 border border-gray-300 text-gray-700 text-[13px] font-medium rounded-lg hover:bg-gray-50 transition-colors">
            <ListFilterIcon size={15} />
            Activity Feed
            <span className="w-2 h-2 rounded-full bg-red-500" />
          </button>
        </div>
      </div>

      {/* Stats row */}
      <div className="flex items-center gap-5 px-6 py-3 border-b border-gray-200 text-[13px] flex-wrap">
        <div className="flex items-center gap-1.5">
          <TruckIcon size={14} className="text-gray-400" />
          <span className="font-bold text-gray-900">{carrier.trucks}</span>
          <span className="text-gray-500">Trucks</span>
        </div>
        <div className="flex items-center gap-1.5">
          <ContainerIcon size={14} className="text-gray-400" />
          <span className="font-bold text-gray-900">{carrier.trailers}</span>
          <span className="text-gray-500">Trailers</span>
        </div>
        <div className="flex items-center gap-1.5">
          <UsersIcon size={14} className="text-gray-400" />
          <span className="font-bold text-gray-900">{carrier.drivers}</span>
          <span className="text-gray-500">Drivers</span>
        </div>
        <div className="w-px h-5 bg-gray-200" />
        <div><span className="text-gray-500">USDOT </span><span className="font-bold text-gray-900">{carrier.usdot}</span></div>
        <div><span className="text-gray-500">MC Number </span><span className="font-bold text-gray-900">{carrier.mcNumber}</span></div>
        <div><span className="text-gray-500">Legal Name </span><span className="font-bold text-gray-900">{carrier.legalName}</span></div>
        <div><span className="text-gray-500">Trade Name </span><span className="font-bold text-gray-900">{carrier.tradeName}</span></div>
      </div>

      {/* Security section */}
      <div className="mx-6 mt-5 mb-4">
        <div className="border border-gray-200 rounded-lg overflow-hidden">
          <div className="px-5 py-4 border-b border-gray-100">
            <div className="flex items-center gap-2 mb-1">
              <ShieldIcon size={18} className="text-gray-500" />
              <span className="text-[16px] font-bold text-gray-900">Security</span>
              {carrier.security.scoreImpact > 0 && (
                <span className="px-2 py-0.5 rounded-full text-[12px] font-bold text-red-600 bg-red-50 border border-red-200">
                  +{carrier.security.scoreImpact}
                </span>
              )}
            </div>
            <p className="text-[12px] text-gray-500 leading-relaxed">
              Is the carrier who they say they are? Does their FMCSA profile match any known criminal organisations / individuals?
            </p>
          </div>
          <div className="p-4 space-y-3">
            <SubsectionRow
              icon={UsersIcon}
              title="Bad Actor Check"
              description="Carrier's details match known criminal organisations."
              threatCount={ba.threatCount}
              scoreImpact={ba.scoreImpact}
              expanded={isExpanded("badActor")}
              onToggle={() => toggle("badActor")}
            >
              {hasChecks && (
                <>
                  <div className="grid grid-cols-3 gap-3 mb-3">
                    {ba.checks.map((check, i) => (
                      <CheckCard key={i} check={check} />
                    ))}
                  </div>
                  <div className="flex items-center gap-1.5 text-[12px] text-gray-400 italic pt-1">
                    <BarChart size={14} />
                    {ba.dataPoints} data points analyzed
                  </div>
                </>
              )}
              {!hasChecks && (
                <div className="flex items-center gap-1.5 text-[12px] text-gray-400 italic">
                  <BarChart size={14} />
                  {ba.dataPoints} data points analyzed
                </div>
              )}
            </SubsectionRow>

            <SubsectionRow
              icon={ActivityIcon}
              title="Operational History"
              description="Carrier's details match known criminal organisations."
              threatCount={oh.threatCount}
              scoreImpact={oh.scoreImpact}
              expanded={isExpanded("opHistory")}
              onToggle={() => toggle("opHistory")}
            >
              <div className="text-[12px] text-gray-500">
                Operational history analysis complete. {oh.threatCount === 0 ? "No anomalies detected." : `${oh.threatCount} concern(s) flagged.`}
              </div>
            </SubsectionRow>
          </div>
        </div>
      </div>

      {/* Authority section */}
      <div className="mx-6 mb-6">
        <div className="border border-gray-200 rounded-lg overflow-hidden">
          <div className="px-5 py-4 border-b border-gray-100">
            <div className="flex items-center gap-2 mb-1">
              <LandmarkIcon size={18} className="text-gray-500" />
              <span className="text-[16px] font-bold text-gray-900">Authority</span>
            </div>
            <p className="text-[12px] text-gray-500 leading-relaxed">
              Is the carrier's USDOT status active according to the FMCSA?
            </p>
          </div>
          <div className="p-4">
            <SubsectionRow
              icon={UsersIcon}
              title="FMCSA Status"
              description="Carrier's details match known criminal organisations."
              threatCount={carrier.authority.fmcsa === "threat" ? 1 : 0}
              scoreImpact={carrier.authority.fmcsa === "threat" ? 15 : 0}
              expanded={isExpanded("fmcsa")}
              onToggle={() => toggle("fmcsa")}
            >
              <div className="text-[12px] text-gray-500">
                {carrier.authority.fmcsa === "no_threat"
                  ? "FMCSA authority status is active and verified. No issues detected."
                  : "FMCSA authority status flagged — carrier may have inactive or revoked operating authority."}
              </div>
            </SubsectionRow>
          </div>
        </div>
      </div>
    </main>
  );
}

// ─── App ─────────────────────────────────────────────────────────────────────

function App() {
  const [selected, setSelected] = useState(carriers[0]);
  const [filter, setFilter] = useState("all");
  const [search, setSearch] = useState("");

  const filtered = useMemo(() => {
    return carriers.filter((c) => {
      const matchSearch = c.name.toLowerCase().includes(search.toLowerCase());
      if (!matchSearch) return false;
      if (filter === "all") return true;
      if (filter === "trusted") return c.status === "trusted";
      if (filter === "new") return c.status === "new";
      if (filter === "unauthorized") return c.status === "unauthorized";
      return true;
    });
  }, [filter, search]);

  return (
    <div className="h-screen flex flex-col">
      <TopNav />
      <div className="flex flex-1 min-h-0">
        <LeftPanel
          carriers={filtered}
          selected={selected}
          onSelect={setSelected}
          filter={filter}
          setFilter={setFilter}
          search={search}
          setSearch={setSearch}
        />
        <RightPanel carrier={selected} />
      </div>
    </div>
  );
}

const root = ReactDOM.createRoot(document.getElementById("root"));
root.render(<App />);
</script>
</body>
</html>
